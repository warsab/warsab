<svg width="340" height="185" viewBox="0 0 340 185"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Most used languages, weighted per repository">
  <title>Most Used Languages</title>
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #3FB950 }
    .sub   { font: 400 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e }
    .lang  { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #C9D1D9 }
    .pct   { fill: #8b949e }
  </style>
  <rect x="0.5" y="0.5" rx="6" width="339" height="184"
        fill="#0D1117" stroke="#30363D"/>
  <text x="25" y="32" class="title">Most Used Languages</text>
  <text x="25" y="46" class="sub">weighted per repository across 47 repos, private included</text>
  <clipPath id="round"><rect x="25" y="55" rx="4"
        width="290" height="8"/></clipPath>
  <g clip-path="url(#round)"><rect x="25.00" y="55" width="134.87" height="8" fill="#3572A5"/><rect x="159.87" y="55" width="53.86" height="8" fill="#e34c26"/><rect x="213.73" y="55" width="25.21" height="8" fill="#f1e05a"/><rect x="238.94" y="55" width="24.61" height="8" fill="#DA5B0B"/><rect x="263.55" y="55" width="22.83" height="8" fill="#3178c6"/><rect x="286.38" y="55" width="8.77" height="8" fill="#663399"/><rect x="295.15" y="55" width="19.85" height="8" fill="#8b949e"/></g>
  <circle cx="30" cy="87" r="5" fill="#3572A5"/><text x="43" y="91" class="lang">Python <tspan class="pct">46.5%</tspan></text><circle cx="175" cy="87" r="5" fill="#e34c26"/><text x="188" y="91" class="lang">HTML <tspan class="pct">18.6%</tspan></text><circle cx="30" cy="107" r="5" fill="#f1e05a"/><text x="43" y="111" class="lang">JavaScript <tspan class="pct">8.7%</tspan></text><circle cx="175" cy="107" r="5" fill="#DA5B0B"/><text x="188" y="111" class="lang">Jupyter Notebook <tspan class="pct">8.5%</tspan></text><circle cx="30" cy="127" r="5" fill="#3178c6"/><text x="43" y="131" class="lang">TypeScript <tspan class="pct">7.9%</tspan></text><circle cx="175" cy="127" r="5" fill="#663399"/><text x="188" y="131" class="lang">CSS <tspan class="pct">3.0%</tspan></text><circle cx="30" cy="147" r="5" fill="#8b949e"/><text x="43" y="151" class="lang">Other <tspan class="pct">6.8%</tspan></text>
</svg>
